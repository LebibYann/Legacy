name: backend-tests

on:
  push:
    paths:
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "1.8.3"

defaults:
  run:
    working-directory: ./new_geneweb/backend

jobs:
  lint-typecheck:
    name: 🔍 Lint & TypeCheck
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install deps
        run: poetry install --no-root

      - name: Run ruff (Linting)
        run: poetry run ruff check .

      - name: Run Black (formatting check)
        run: poetry run black --check .

      - name: Run mypy (type checking)
        run: poetry run mypy app/

  unit-tests:
    name: 🧪 Unit & Functional Tests
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install deps
        run: poetry install --no-root

      - name: Run pytest
        env:
          APP_ENV: test
          APP_NAME: geneweb
          APP_HOST: localhost
          APP_PORT: 8000
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/geneweb_test
        run: poetry run pytest --maxfail=1 --disable-warnings -q --cov=app --cov-report=xml