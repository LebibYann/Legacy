name: backoffice-tests

on:
  push:
    branches: ["**"]
    paths:
      - "new_geneweb/backoffice/**"
      - ".github/workflows/backoffice-tests.yml"
  pull_request:
    branches:
      - dev

defaults:
  run:
    working-directory: ./new_geneweb/backoffice

jobs:
  install-deps:
    name: 📦 Install Dependencies
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci

  docker-build:
    name: 🐳 Docker Build Validation
    needs: install-deps
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Install docker compose
        run: |
          # Add Docker's official GPG key:
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc

          # Add the repository to Apt sources:
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build backend Docker image
        run: docker compose build

  lint-typecheck:
    name: 🔍 Lint & TypeCheck
    needs: docker-build
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript type checking
        run: npm run check

  unit-tests:
    name: 🧪 Unit & Functional Tests
    needs: docker-build
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Vitest
        run: npx playwright install --with-deps chromium
      - name: Run Vitest
        run: npm run test -- --run

  accessibility:
    name: ♿ Accessibility & Lighthouse
    needs: docker-build
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Lighthouse CI
        run: npm run lighthouse || echo "Lighthouse issues detected"