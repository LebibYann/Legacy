name: backoffice-tests

on:
  push:
    paths:
      - ".github/workflows/backoffice-tests.yml"
  pull_request:
    paths:
      - "new_geneweb/backoffice/**"
      - "!**/*.md"
  workflow_dispatch:

defaults:
  run:
    working-directory: ./new_geneweb/backoffice

jobs:
  install-deps:
    name: 📦 Install Dependencies
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci

  lint-typecheck:
    name: 🔍 Lint & TypeCheck
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type checking and formatting
        run: npm run lint

  unit-tests:
    name: 🧪 Unit & Functional Tests
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm run test:unit -- --run

  accessibility:
    name: ♿ Accessibility & Lighthouse
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Lighthouse CI
        run: npm run lighthouse || echo "Lighthouse issues detected"