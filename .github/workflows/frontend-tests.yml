name: frontend-tests

on:
  push:
    paths:
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "new_geneweb/frontend/**"
      - "!**/*.md"
  workflow_dispatch:

defaults:
  run:
    working-directory: ./new_geneweb/frontend

jobs:
  install-deps:
    name: 📦 Install Dependencies
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

  lint-typecheck:
    name: 🔍 Lint & TypeCheck
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript type checking
        run: npm run check

  unit-tests:
    name: 🧪 Unit & Functional Tests
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Vitest
        run: npx playwright install --with-deps chromium
      - name: Run Vitest
        run: npm run test -- --run

  accessibility:
    name: ♿ Accessibility & Lighthouse
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new_geneweb/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Lighthouse CI
        run: npm run lighthouse || echo "Lighthouse issues detected"