name: frontends-e2e-tests

env:
  TEST_FOLDER: tests/end-to-end
  BACKEND_FOLDER: new_geneweb/backend
  BACKOFFICE_URL: http://localhost:5173
  FRONTEND_URL: http://localhost:5174

on:
  push:
    paths:
      - ".github/workflows/svelte-e2e-tests.yml"
  pull_request:
    paths:
      - "new_geneweb/**"
      - "tests/end-to-end/**"
      - "docker-compose.yml"
      - "./**/Dockerfile"
      - "!**/*.md"
  workflow_dispatch:

jobs:
    e2e-tests:
      name: 🛣️ Frontends End-to-End Tests
      runs-on: self-hosted

      services:
        docker:
          image: docker:dind

      permissions:
        contents: read
        packages: write   # required to push to GHCR
        id-token: write

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install docker compose
          run: |
            # Add Docker's official GPG key:
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc

            # Add the repository to Apt sources:
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

        - name: Install xvfb
          run: sudo apt-get update && sudo apt-get install -y xvfb


        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # ----------------------------------------------------------
        # BACKEND (FastAPI)
        # ----------------------------------------------------------
        - name: Build backend image
          uses: docker/build-push-action@v6
          with:
            context: ./new_geneweb/backend
            file: ./new_geneweb/backend/Dockerfile
            tags: ghcr.io/${{ github.repository }}:backend
            push: true
            cache-from: type=gha,scope=backend
            cache-to: type=gha,scope=backend,mode=max

        # ----------------------------------------------------------
        # BACKOFFICE (Svelte ou autre front interne)
        # ----------------------------------------------------------
        - name: Build backoffice image
          uses: docker/build-push-action@v6
          with:
            context: ./new_geneweb/backoffice
            file: ./new_geneweb/backoffice/Dockerfile
            tags: ghcr.io/${{ github.repository }}:backoffice
            push: true
            cache-from: type=gha,scope=backoffice
            cache-to: type=gha,scope=backoffice,mode=max

        # ----------------------------------------------------------
        # FRONTEND (public webapp)
        # ----------------------------------------------------------
        - name: Build frontend image
          uses: docker/build-push-action@v6
          with:
            context: ./new_geneweb/frontend
            file: ./new_geneweb/frontend/Dockerfile
            tags: ghcr.io/${{ github.repository }}:frontend
            push: true
            cache-from: type=gha,scope=frontend
            cache-to: type=gha,scope=frontend,mode=max

        - name: Build New Geneweb
          run: |
            cat ${{ env.BACKEND_FOLDER }}/.env.example > ${{ env.BACKEND_FOLDER }}/.env
            docker pull ghcr.io/${{ github.repository }}:backend
            docker pull ghcr.io/${{ github.repository }}:frontend
            docker pull ghcr.io/${{ github.repository }}:backoffice

        - name: Start New Geneweb
          run: |
            docker compose up -d
            timeout=600  # 10 minutes in seconds
            interval=5   # check every 5 seconds
            elapsed=0

            echo "Waiting for ${{ env.BACKOFFICE_URL }} to respond..."
            while [ $elapsed -lt $timeout ]; do
                if curl -s --connect-timeout 3 ${{ env.BACKOFFICE_URL }} > /dev/null 2>&1; then
                    echo "${{ env.BACKOFFICE_URL }} is ready!"
                    break
                fi
                echo "${{ env.BACKOFFICE_URL }} not ready yet, waiting... ($elapsed/$timeout seconds)"
                sleep $interval
                elapsed=$((elapsed + interval))
            done

            if [ $elapsed -ge $timeout ]; then
                echo "Timeout: ${{ env.BACKOFFICE_URL }} did not respond within 10 minutes"
                exit 1
            fi

            echo "Checking ${{ env.FRONTEND_URL }} responds..."
            curl -s --connect-timeout 3 ${{ env.FRONTEND_URL }} > /dev/null 2>&1
            echo "${{ env.FRONTEND_URL }} is ready!"

        - name: Setup end-to-end tests
          run: |
            cd ${{ env.TEST_FOLDER }}
            sudo npx playwright install-deps
            npm i
            npm run install:browsers

        - name: Run end-to-end tests (chromium / firefox / webkit)
          run: |
            cd ${{ env.TEST_FOLDER }}
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:svelte:chromium:ci
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:svelte:firefox:ci
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:svelte:webkit:ci

        - name: Cleanup Docker
          if: always()
          run: |
            docker compose down -v || true
            docker system prune -af || true