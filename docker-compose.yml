services:
  db:
    image: postgres:16
    container_name: geneweb-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geneweb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d geneweb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./new_geneweb/backend
    restart: always
    container_name: geneweb-backend
    volumes:
      - ./new_geneweb/backend/:/app
    env_file:
      - ./new_geneweb/backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: geneweb
      DATABASE_URL: postgresql://user:password@db:5432/geneweb?schema=public
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  backoffice:
    build: new_geneweb/backoffice
    ports:
      - "5173:5173"

volumes:
  pgdata:
