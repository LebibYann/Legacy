x-backoffice-base: &backoffice-base
  build:
    context: ./new_geneweb/backoffice/
    dockerfile: Dockerfile
  volumes:
    - ./new_geneweb/backoffice:/src
  ports:
    - "5173:5173"

x-frontend-base: &frontend-base
  build:
    context: ./new_geneweb/frontend
    dockerfile: Dockerfile
  volumes:
    - ./new_geneweb/frontend:/src
  ports:
    - "5174:5174"

x-backend-base: &backend-base
  build:
    context: ./new_geneweb/backend
    dockerfile: Dockerfile
  restart: always
  container_name: geneweb-backend
  volumes:
    - ./new_geneweb/backend/:/app
  env_file:
    - ./new_geneweb/backend/.env
  environment:
    DB_HOST: db
    DB_PORT: 5432
    DB_USER: user
    DB_PASSWORD: password
    DB_NAME: geneweb
    DATABASE_URL: postgresql://user:password@db:5432/geneweb?schema=public
  ports:
    - "8000:8000"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    profiles: [prod, dev, db]
    image: postgres:16
    container_name: geneweb-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geneweb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d geneweb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geneweb-network

  backend:
    <<: *backend-base
    profiles: [prod]

  backoffice:
    <<: *backoffice-base
    profiles: [prod]

  frontend:
    <<: *frontend-base
    profiles: [prod]

  # ===== DEV =====

  backend_dev:
    <<: *backend-base
    profiles: [dev]
    build:
      context: ./new_geneweb/backend/
      dockerfile: Dockerfile.dev
    container_name: geneweb-backend-dev

  backoffice_dev:
    <<: *backoffice-base
    profiles: [dev]
    build:
      context: ./new_geneweb/backoffice/
      dockerfile: Dockerfile.dev

  frontend_dev:
    <<: *frontend-base
    profiles: [dev]
    build:
      context: ./new_geneweb/frontend/
      dockerfile: Dockerfile.dev


volumes:
  pgdata:

networks:
  geneweb-network:
    driver: bridge