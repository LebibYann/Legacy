[tool.poetry]
name = "geneweb-backend"
version = "0.1.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.117.1"
uvicorn = {extras = ["standard"], version = "^0.36.0"}
pydantic = "^2.11.9"
pydantic-settings = "^2.10.1"
sqlalchemy = "^2.0.43"
asyncpg = "^0.30.0"
alembic = "^1.16.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
httpx = "^0.28.1"
pytest-asyncio = "^1.2.0"
mypy = "^1.18.2"
black = "^25.9.0"
ruff = "^0.13.1"
pre-commit = "^4.3.0"
pytest-watch = "^4.2.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
lint.select = ["E","F","I","B","UP","N","S","W","C90"]
lint.ignore = ["E203","S101"]
exclude = ["alembic"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]

